name: App gate

# The web app's end-to-end tests (issues #246, #1094). The web app is the app: the desktop app is paused
# (ADR 0026), so this is the only test of the app's behaviour. It runs on every pull request and merge
# group that changes the app, the engine or the Text Library; release.yml calls it, so a release waits on
# it; a maintainer can start it by hand. It needs no write permission, so a release can call it.

on:
  pull_request:
  # The merge queue: a check that runs on a pull request runs on the merge group's commit as well.
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Any other run has a group of its own (the run id).
concurrency:
  group: app-gate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Does the change reach the web app? A pull request or merge group that changes none of these paths
  # skips `web-app`, and a skipped job counts as passed, so `web-app` can be a required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;; # the merge commit's first parent is the base branch
            merge_group) git fetch --quiet --depth=1 origin "$GROUP_BASE"; base="$GROUP_BASE" ;;
            *) echo "app=true" >> "$GITHUB_OUTPUT"; exit 0 ;; # a release or a run by hand: always
          esac
          if git diff --name-only "$base" HEAD \
              | grep -qE '^(app/|crates/|locales/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|tools/build_web\.sh$|\.github/workflows/app-gate\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No change to the app, the engine or the Text Library: the web app tests are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The web app (issue #246): the web build of the front end over the wasm Design session, in
  # headless Chrome. The wasm-bindgen CLI is the version the ovd-web crate pins.
  web-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: The pinned wasm-bindgen version
        id: wb
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/ovd-web/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen CLI (cached)
        id: cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wb.outputs.version }}-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked
      - name: Build the web package
        run: bash tools/build_web.sh
      - name: Build ovd
        run: cargo build -p ovd-cli
      - name: Front end (type check, desktop build, web build)
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run build:web
      - name: Web smoke test (headless Chrome)
        working-directory: app
        env:
          # The smoke test saves each view, light and dark, here, for review.
          OVD_WEB_SHOTS: ${{ runner.temp }}/web-screenshots
        run: bash e2e/run-web.sh
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/web-screenshots
          if-no-files-found: warn
