# What phase 2 may fit from these cases, and what it may not (no fit is run here):
#   - Deckhouse steel per m3 of house: S01 only (79 t on 2,301 m3 listed, an estimate, so a cross-check of the
#     textbook rate of D19, not a fit). No built vessel here prints a steel breakdown.
#   - Outfit mass per m2 of floor area: S01 only, an estimate (468.6 t on 769 m2 of house floor, or 0.25 t per m2 of L x B).
#   - Stern block length: S01, S02 (and S04, low confidence) are independent of the 23 ships already in
#     propulsion_cases.yaml, so they can test the aft peak and room allowance out of sample.
#   - Deckhouse length and breadth by tier: S01 to S04.
# Not available from these cases: a measured outfit or steel mass of a built gas carrier or tug.
