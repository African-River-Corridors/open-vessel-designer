# Stern-arrangement calibration cases: held-out, measured from published general arrangements (GAs).
# Issue #782 (Stern 10), spec 0011 D11 and D19. PHASE 1: COLLECT AND RECORD ONLY.
#
# Nothing reads this file yet. No rate, factor, tolerance or band changes with it, and no result moves.
# Phase 2 (a separate, reviewed change) fits the deckhouse and engine-room steel rates from it.
#
# Conventions
#   held_out: "<reason>"  every case here (a one-line reason, as elsewhere in this folder). None may be used to fit until phase 2 is reviewed and says so.
#   Each measured value is {value, unit, drawing, scale_ref, unc}:
#     drawing    where on which source the feature is drawn (document, page or figure)
#     scale_ref  the dimension that sets the scale (a stated LOA, LBP, beam, or a frame ruler)
#     unc        the measurement uncertainty, +/- and in the unit of the value. It covers picking the
#                feature edges on the raster and the scale reference; it does not cover whether the
#                drawing matches the built ship.
#   stern_block_m          from the aft end of the hull to the forward end of the last machinery space
#                          below deck (the definition of `stern_block_case` in propulsion_cases.yaml).
#   deckhouse_*            the accommodation/wheelhouse block above the main deck. `tiers` counts levels.
#   A figure the source does not give is null. Nothing is estimated or filled in.
#   Lightship figures are as the source prints them. Where the source calls them estimates, `weights_basis`
#   says so; an estimate is not an observation.
#   Source files are NOT in the repo (licences not confirmed). Each carries the sha256 of the bytes read.
#   Measuring method: the GA raster was rendered or downloaded, feature edges were read off it in pixels,
#   and each length is pixels x (stated length / drawn pixels). Pixel edges were read by eye on zoomed crops,
#   with one automated hull-extent check on the two Robert Allan drawings.
#
# Vessels looked at and not recorded ("no GA" = no drawing with enough detail was reachable):
#   - Engie Zeebrugge (Deltamarin sheet), Severnoe 3,000 m3 bunkering vessel, Xin Ao Pu Tuo Hao, SENER 8,000 m3,
#     Vard/SeaspanLNG 7,600 m3, Gas Agility, Q-LNG 4000 and its tug: published dimensions only, no GA.
#   - Damen ASD Tug 2713 FF: methanol/dual-fuel "fuel flexible", not gas-fuelled; product sheet GA not usable.
#   - KHI/Daihatsu-type 3,500 m3 bunkering ship (SlideShare deck): the GA is an image that could not be fetched.
#   - UBC capstone 5,000 m3 LNG bunker vessel: the host blocked automated download; not retrieved.

held_out_note: "Phase 1 of #782. Collected and recorded only; used for no fit."

stern_cases:
  - id: S01-webb-lngbv-4200
    held_out: "phase 1 of #782; collected only, not fitted"
    vessel: "4,200 m3 LNG bunkering vessel (SNAME 2020 student ship design entry, 'LNG Bunkering Solutions')"
    kind: gas_bunker_vessel
    status: concept design (not built)
    confidence: medium
    confidence_note: "GA is dimensioned (stated LOA, LBP, frame ruler at 0.600 m); weights are parametric estimates"
    principal:
      loa_m: 92.9          # drawing's Principal Characteristics; the weight sheet gives 92.92 with forecastle, 90 m hull
      lbp_m: 85.0
      beam_m: 20.0
      depth_m: 10.0
      draught_m: 3.75      # GA; the entry's weight sheet gives 4.0, the summary sheet 4.1 (source disagrees with itself)
      cargo_m3: 4200       # GA; the weight sheet says 4000, the summary sheet 2 x 2,200 m3
      crew: {value: 15, basis: "summary sheet 'Complement: 15'; the report text says 18 staterooms (8 on 03 deck, 8 on 02 deck, 2 on 01 deck)"}
    propulsion: "diesel-electric, 2 x Wartsila 8L34DF 3,490 kWe + 2 x 6L20DF 1,065 kWe, twin screws, 1 bow thruster 614 kW"
    measured:
      stern_block_m:
        value: 19.5
        drawing: "GA part 1 (PDF p. 90 of the entry): main deck plan, stern end at frame 145.5 to the forward end of ECR/store block at frame 113"
        scale_ref: "frame ruler on the drawing (0.600 m per frame, 14.2 px per frame at 2x zoom); cross-check: 145.5 frames x 0.6 + 2.62 m bow tip to FP = 89.9 m vs stated 90 m hull"
        unc: 0.6
      engine_room_length_m:
        value: 19.5
        drawing: "same plan and profile; machinery block including steering gear room and ECR (no aft peak split drawn)"
        scale_ref: "frame ruler"
        unc: 0.6
        note: "not independent of stern_block_m (includes steering gear)"
      deckhouse_length_m:
        value: 12.0
        drawing: "GA part 1, weather deck (01 deck) plan: galley block, frames 133 to 113"
        scale_ref: "frame ruler"
        unc: 0.5
        note: "plus an exhaust casing on the centreline reaching aft to frame 141, which makes the full house 17.0 m"
      deckhouse_breadth_m:
        value: 13.1
        drawing: "GA part 1, weather deck plan: house width against 20.0 m beam (235 drawn px for 20 m)"
        scale_ref: "stated beam 20.0 m"
        unc: 0.5
      deckhouse_tiers: {value: 4, drawing: "GA part 1 outboard profile and midship section: 01, 02, 03 and navigation decks", unc: 0}
      deckhouse_volume_m3:
        value: 2301
        basis: "sum of the listed space volumes of the navigation, 03, 02 and 01 decks (Appendix F area and volume report: 745 + 530 + 535 + 491); excludes structure, includes exhaust casings"
        drawing: "report Appendix F, table 'Area and Volume Report' (page F-1)"
        scale_ref: "not scaled: printed by the designers"
        unc: 230
        cross_check: "plan envelope 12.0 x 13.1 m x 4 tiers x 2.97 m (volume/area of the 01 deck galley) = 1,870 m3 without the casings; the 19 % gap is the casings and the wheelhouse overhang"
      deckhouse_floor_area_m2: {value: 769, basis: "sum of listed areas, 4 tiers (248 + 177 + 179 + 165)", drawing: "Appendix F", unc: 40}
    lightship:
      value_t: 2687.55
      basis: "basic estimate 2,337.00 t plus 350.55 t of weight margin (design-maturity analysis); the entry's own estimate"
      weights_basis: "estimate (Watson & Gilfillan parametric methods, SNAME entry Appendix P); not observed"
      breakdown_t:
        hull_steel_total: 1167         # deckhouse 79 + poop 51 + forecastle 19 + hull unassigned 371 + longitudinal 647
        deckhouse_structure: 79
        poop_deck_structure: 51
        forecastle_structure: 19
        machinery_total: 420.0         # DE plant 234.6 + 2 x 76 (8L34DF) + 2 x 16.7 (6L20DF)
        outfit_command_and_surveillance_and_furnishing_400_600: 187.44
        auxiliary_systems_500: 562.56  # 281.16 allocated from the outfit coefficient + 281.4 itemised systems
        outfit_coefficient_total: 468.6  # Watson outfit weight (SWBS 400+500+600 unallocated), split 40 % / 60 %
        weight_margin: 350.55
      outfit_note: "outfit 468.6 t on 92.9 x 20 m: 0.25 t/m2 of LOA x B. An estimate by a coefficient, not a weighed value."
    sources:
      - id: SRC-S01a
        title: "Webb Institute / SNAME Student Ship Design Competition 2020 sample entry, 4,200 m3 LNG Bunkering Vessel (LNG Bunkering Solutions)"
        url: "https://sname.org/sites/default/files/2021-01/2020%20Sample%20for%20Entrants.pdf"
        retrieved: 2026-11-02
        sha256: ab0d8e99d312636f6f678af8f545508aee8d971b15802935f7dce98b3df7b53f
        pages_read: "GA: PDF p. 90; Appendix F (area and volume report) p. F-1; weight estimate and lightship p. P-1; text on accommodation, structure, outfit weight"
      - id: SRC-S01b
        title: "Webb Institute 3-page project handout (principal characteristics: 95 m LOA, 20 m beam, 10 m depth, 4.1 m draft, 2,687 MT lightship, complement 15)"
        url: "https://www.webb.edu/wp-content/uploads/2020/05/Group-Handouts-LNG-Bunkering-Vessel.pdf"
        retrieved: 2026-11-02
        sha256: e40ee14584bfa1f78f9892474f9a0b63b52cea7a7b0a1aceebb8502b3682f6b3
        note: "its LOA 95 m and draft 4.1 m differ from the GA (92.9 m, 3.75 m); the GA values are used"
    licence: "student design report; facts and figures cited only; no image is reproduced here"

